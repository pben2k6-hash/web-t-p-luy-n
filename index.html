<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial;
        }

        .btn{
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{
            transform: scale(1.1);
            background: #f1f1f1;
        }
    </style>
</head>
<body>

    <a href="tho.html">
        <button class="btn">Đi đến trang giới thiệu</button>
    </a>

</body>
</html>
